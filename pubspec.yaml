name: az_incident_alert
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+16

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  go_router: ^13.2.0
  flutter_screenutil: ^5.9.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  dio: ^5.4.1
  pretty_dio_logger: ^1.3.1
  flutter_snake_navigationbar: ^0.6.1
  animate_do: ^3.3.4
  google_fonts: ^6.2.1
  html_unescape: ^2.0.0
  flutter_spinkit: ^5.2.1
  # connectivity_plus: ^6.1.4
  after_layout: ^1.2.0
  flutter_local_notifications: ^17.1.2
  permission_handler: ^11.3.1
  timezone: ^0.9.3
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  fluttertoast: ^8.2.6
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  cloud_firestore: ^5.0.1
  device_info_plus: ^10.1.0
  in_app_purchase: ^3.2.1
  in_app_purchase_storekit:
  mapbox_maps_flutter: ^2.8.0
  connectivity_plus: ^6.1.4
  flutter_dotenv: ^5.2.1
  image: ^4.5.4
  firebase_database: ^11.3.6
  cloud_functions: ^5.5.1
  firebase_crashlytics: ^4.3.10
  firebase_analytics:
  flutter_svg: ^1.1.6


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0


flutter:
  uses-material-design: true


  assets:
    - assets/images/
    - assets/images/svg/
    - assets/images/png/
    - env

    

  fonts:
    - family: sedanSC
      fonts:
        - asset: assets/fonts/SedanSC-Regular.ttf


flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/appicon.png"
  adaptive_icon_background: "white"
  adaptive_icon_foreground: "assets/icon/appicon.png"

